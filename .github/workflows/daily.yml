name: Telegram Daily Digest

on:
  schedule:
    - cron: "15 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python generate_digest.py

      - name: Commit and push changes (if any)
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Нет изменений — коммит не требуется."
          else
            git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push
          fi
